version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: vert_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/vert-sh/vert:latest@sha256:placeholder
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUB_HOSTNAME: "http://${DEVICE_DOMAIN_NAME}:${APP_VERT_PORT}"
      PUB_ENV: production
      PORT: 80
      # Configuration optionnelle pour Plausible Analytics
      # PUB_PLAUSIBLE_URL: ""
      # Configuration optionnelle pour vertd (serveur de conversion vidéo)
      # PUB_VERTD_URL: ""
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    networks:
      default:
        ipv4_address: ${APP_VERT_WEB_IP}
